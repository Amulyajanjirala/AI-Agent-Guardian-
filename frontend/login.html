<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Agent Guardian</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 30%, rgba(0, 229, 255, 0.05), transparent 60%), var(--bg-dark);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 38px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-shield {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #070b12;
      margin-bottom: 14px;
      box-shadow: var(--shadow-glow);
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    .login-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .demo-credentials-box {
      margin-top: 24px;
      padding: 12px 16px;
      background-color: rgba(0, 229, 255, 0.04);
      border: 1px dashed rgba(0, 229, 255, 0.25);
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .demo-credentials-box strong {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-shield">🛡️</div>
        <h1 class="login-title">AI AGENT GUARDIAN</h1>
        <div class="login-subtitle">Intelligent Security for Autonomous AI</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="admin or admin@guardian.local" 
            value="admin"
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Security Key / Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••" 
            value="admin123"
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
          <label style="display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--text-secondary); cursor:pointer;">
            <input type="checkbox" id="remember-me" checked> Remember this terminal
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">
          Authenticate Terminal
        </button>
      </form>

      <div class="demo-credentials-box">
        <strong>Demo Security Operator:</strong><br>
        User: <code>admin</code> | Password: <code>admin123</code><br>
        Analyst: <code>analyst</code> | Password: <code>analyst123</code>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
